name: V8 Quant Gemini NSE Alert

on:
  workflow_dispatch:

  schedule:
    # GitHub cron is UTC.
    # 10:15 UTC = 15:45 IST.
    - cron: "15 10 * * 1-5"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        run: |
          python --version
          python -c "import yfinance; print('yfinance', yfinance.__version__)"
          python -c "import sklearn; print('sklearn', sklearn.__version__)"
          python -c "import google.genai; print('google-genai OK')"

      - name: Run V8 Quant + Gemini
        env:
          BACKTEST_PERIOD: "6y"
          PRIMARY_HORIZON: "10"

          MIN_PROBABILITY: "0.62"
          MIN_PREDICTED_RETURN: "0.006"

          QUANT_WEIGHT: "0.70"
          GEMINI_WEIGHT: "0.30"

          ROUND_TRIP_COST: "0.003"

          MAX_VOLATILITY: "0.065"
          MAX_STOCKS_IN_ALERT: "5"

          GEMINI_MODEL: "gemini-3.8-flash"

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONUNBUFFERED: "1"

        run: |
          python V8_quant_gemini_alert.py

      - name: Upload V8 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8-audit-${{ github.run_number }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
