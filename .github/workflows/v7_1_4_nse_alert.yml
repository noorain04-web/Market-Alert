name: V7.1.4 NSE Quant Alert

on:
  workflow_dispatch:

  schedule:
    # 09:25 IST = 03:55 UTC
    # Runs Monday-Friday.
    - cron: "55 3 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v7-1-4-nse-alert
  cancel-in-progress: false

jobs:

  live-alert:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              "numpy>=2.0,<3" \
              "pandas>=2.2,<3" \
              "scikit-learn>=1.8,<1.9" \
              "yfinance==0.2.66" \
              "requests>=2.31,<3"
          fi

      - name: Verify environment
        run: |
          python --version
          python - <<'PY'
          import numpy
          import pandas
          import sklearn
          import yfinance
          import requests

          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("scikit-learn:", sklearn.__version__)
          print("yfinance:", yfinance.__version__)
          print("requests:", requests.__version__)
          PY

      - name: Show repository
        run: |
          echo "Repository root:"
          ls -la

          echo "Workflow:"
          ls -la .github/workflows || true

          echo "State:"
          ls -la state || true

          echo "Audit:"
          ls -la audit || true

      - name: Run V7.1.4 FAST LIVE ALERT
        env:
          BACKTEST_PERIOD: "2y"
          PYTHONUNBUFFERED: "1"

          SEND_TELEGRAM: "1"

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python V7_1_4_live_alert.py

      - name: Commit Telegram deduplication state
        if: always()
        run: |
          if [ -f state/telegram_alert_state.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state/telegram_alert_state.json audit/ || true

            if git diff --cached --quiet; then
              echo "No state/audit changes to commit."
            else
              git commit -m "Update V7.1.4 alert state"
              git push
            fi

          else
            echo "No Telegram state file created."
          fi

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V7.1.4-nse-alert-audit
          path: |
            audit/
            state/
          if-no-files-found: warn
          retention-days: 30
