name: V8.1 NSE Quant + Gemini Alert

on:
  workflow_dispatch:
  schedule:
    # 15:40 IST = 10:10 UTC, Monday-Friday.
    - cron: "10 10 * * 1-5"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V8.1
        env:
          PYTHONUNBUFFERED: "1"
          BACKTEST_PERIOD: "6y"
          LIVE_PERIOD: "2y"
          HORIZON: "10"
          P_THRESHOLD: "0.62"
          RETURN_THRESHOLD: "0.006"
          ROUND_TRIP_COST: "0.003"

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          ENABLE_GEMINI_SEARCH: "1"
          MAX_GEMINI_SECONDS: "45"

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: "1"

          RUN_BACKTEST: "0"
        run: |
          python V8_1_nse_quant_gemini.py

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V8.1-audit-${{ github.run_number }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
