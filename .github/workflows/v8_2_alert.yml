name: V8.2 NSE Quant + Gemini Alert

on:
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Run the historical quant backtest before the live scan"
        required: false
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
  schedule:
    # 15:15 UTC = 20:45 IST. Change if you want a different post-market run.
    - cron: "15 15 * * 1-5"

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V8.2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          PYTHONUNBUFFERED: "1"
          BACKTEST_PERIOD: "6y"
          LIVE_PERIOD: "2y"

          HORIZON: "10"
          ROUND_TRIP_COST: "0.003"

          P_THRESHOLD: "0.62"
          RETURN_THRESHOLD: "0.006"
          MAX_VOLATILITY: "0.065"
          MAX_EVENT_RISK: "0.85"

          TOP_N_QUANT: "20"
          TOP_N_GEMINI: "15"
          TOP_N_ALERT: "8"

          GEMINI_MODEL: "gemini-3.8-flash"
          ENABLE_GEMINI: "1"
          ENABLE_GEMINI_SEARCH: "1"

          GEMINI_PROB_WEIGHT: "0.10"
          GEMINI_RETURN_WEIGHT: "0.15"
          GEMINI_RISK_WEIGHT: "0.10"
          MAX_GEMINI_RETURN_ADJUSTMENT: "0.015"

          SEND_TELEGRAM: "1"
          RUN_BACKTEST: ${{ github.event.inputs.run_backtest || '0' }}

        run: |
          python V8_2_nse_quant_gemini.py

      - name: Upload V8.2 audit
        uses: actions/upload-artifact@v4
        with:
          name: V8.2-audit-${{ github.run_number }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
